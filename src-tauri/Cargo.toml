[package]
name = "imgview"
version = "0.1.0"
description = "A minimal SVG/image viewer with pan and zoom"
authors = ["you"]
edition = "2021"

[lib]
name = "imgview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["pnm", "png", "jpeg", "gif", "webp"] }
