<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imgview</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- defer (not a blocking <script>): lets HTML parsing continue
         immediately, so main.js's invoke('get_image') call — the thing
         actually gating time-to-image — isn't stuck waiting behind this
         parsing first. `defer` scripts still run in document order, so this
         is guaranteed to finish before main.js's deferred script starts. -->
    <script src="vendor/svg-pan-zoom.min.js" defer></script>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="laser-pointer"></div>
    <script src="main.js" defer></script>
  </body>
</html>
